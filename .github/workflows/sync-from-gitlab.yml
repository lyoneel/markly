name: sync-from-gitlab
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from GitLab
        run: |
          set -euo pipefail
          git clone https://github.com/lyoneel/markly.git repo
          cd repo
          git config user.name 'Sync Bot'
          git config user.email 'sync-bot@localhost'
          git remote set-url origin "https://x-access-token:${{ secrets.SYNC_PUSH_TOKEN }}@github.com/lyoneel/markly.git"
          git fetch https://gitlab.com/lyoneel/markly.git '+refs/heads/*:refs/remotes/gitlab/*' '+refs/tags/*:refs/tags/*'
          if git show-ref --verify --quiet refs/remotes/gitlab/master; then
            git merge --no-ff --no-edit --allow-unrelated-histories gitlab/master
            git push --force origin master
          fi
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/gitlab); do
            name=${b#gitlab/}
            if [ "$name" = "master" ]; then
              continue
            fi
            git push --force origin "refs/remotes/gitlab/$b:refs/heads/$name"
          done
          git push --force origin 'refs/tags/*:refs/tags/*'
