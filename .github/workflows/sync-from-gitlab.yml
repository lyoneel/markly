name: sync-from-gitlab
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Env probe
        run: |
          printenv | grep -o '^[A-Za-z_]*' | sort -u | tr '\n' ' '
          echo
          if [ -n "${GITHUB_TOKEN+x}" ]; then echo "GITHUB_TOKEN: present"; else echo "GITHUB_TOKEN: ABSENT"; fi
